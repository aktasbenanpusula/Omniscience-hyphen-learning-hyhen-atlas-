<script>
window.ATLAS_KNOWLEDGE={"deep":{"black-hole-physics/schwarzschild-radius":{"intro":"The Schwarzschild radius gives the event-horizon radius of an idealised, non-rotating, uncharged black hole with a given mass.","sections":[{"heading":"A boundary in spacetime","body":"For a Schwarzschild black hole, the event horizon is the boundary separating events that can send signals to distant observers from events that cannot. It is not a solid surface; it is a causal boundary."},{"heading":"Deriving the scale","body":"The radius is rₛ = 2GM/c², where G is the gravitational constant, M is mass, and c is the speed of light. For one solar mass, rₛ is approximately 2.95 kilometres. Doubling the mass doubles this radius."},{"heading":"What an outside observer sees","body":"As light travels outward from near a compact object, gravitational redshift makes the received wavelength longer. Descriptions of infalling clocks depend on the chosen coordinates; local observers cross a sufficiently large horizon in finite proper time."},{"heading":"Where this approximation stops","body":"The Schwarzschild solution assumes spherical symmetry, no rotation, and no electric charge. Real astrophysical black holes commonly rotate, so the Kerr geometry is often the better model."}],"terms":[["Event horizon","Causal boundary beyond which light cannot reach distant infinity."],["Schwarzschild radius","The horizon radius 2GM/c² for a non-rotating black hole."]],"example":["A black hole has 8 times the Sun’s mass. Estimate its Schwarzschild radius.",["Use 2.95 km per solar mass.","Multiply 8 × 2.95."],"About 23.6 km."],"misconceptions":["The event horizon is not a hard crust.","The familiar radius formula does not describe every rotating black hole."],"takeaway":"Gravity changes spacetime geometry, not simply the strength of a pulling force."},"black-hole-physics/event-horizon":{"intro":"An event horizon is a globally defined causal boundary, not an ordinary visible shell.","sections":[{"heading":"What can escape?","body":"Outside a black hole, appropriately directed light signals can travel outward. Inside the event horizon of a classical black hole, no future-directed path takes a signal to distant infinity."},{"heading":"How horizons differ from photon spheres","body":"A photon sphere is where light can orbit along an unstable circular path. For a Schwarzschild black hole it lies at 1.5 times the Schwarzschild radius, outside the horizon."},{"heading":"What images show","body":"The Event Horizon Telescope observes radio emission from hot plasma surrounding black holes. Its famous images show bright emission and a darker central region called a black hole shadow, not a photograph of the horizon itself."}],"terms":[["Photon sphere","Unstable region where light can orbit the black hole."],["Shadow","Dark observed region created by light capture and gravitational lensing."]],"example":["A Schwarzschild black hole has horizon radius 20 km. Estimate its photon-sphere radius.",["Use 1.5 × horizon radius."],"30 km."],"misconceptions":["Black-hole shadows and event horizons are related but different."],"takeaway":"Horizon, photon sphere and shadow are three distinct concepts."},"black-hole-physics/hawking-radiation":{"intro":"Hawking radiation is a prediction that black holes have a temperature when quantum fields are considered in curved spacetime.","sections":[{"heading":"The central result","body":"The Hawking temperature for a Schwarzschild black hole is T = ħc³/(8πGMkB). Larger mass means lower temperature. A stellar-mass black hole would be extraordinarily cold."},{"heading":"Why the popular picture is incomplete","body":"The common story of virtual particle pairs appearing at the horizon is a metaphor, not the full derivation. The robust prediction arises from quantum field theory and the distinction between observers and vacuum states."},{"heading":"Evaporation and evidence","body":"If isolated, a black hole loses mass very slowly through this process. Direct Hawking radiation from an astrophysical black hole has not been detected; analogue experiments probe related physics but are not direct astrophysical observations."}],"terms":[["Hawking temperature","Effective black-hole temperature predicted by quantum field theory in curved spacetime."],["Evaporation","Long-term mass loss through emitted quantum radiation."]],"example":["Two nonrotating black holes have masses M and 4M. Compare their Hawking temperatures.",["Temperature varies inversely with mass."],"The 4M black hole is four times colder."],"misconceptions":["A theoretical prediction is not the same as an observational detection."],"takeaway":"Hawking radiation connects gravity, quantum theory and thermodynamics."},"black-hole-physics/information-paradox":{"intro":"The black hole information paradox asks how quantum mechanics and black hole evaporation can be reconciled.","sections":[{"heading":"Why it matters","body":"Unitary quantum evolution preserves information in a precise mathematical sense. Hawking’s original thermal radiation calculation seems, under certain assumptions, to conflict with that expectation."},{"heading":"Modern ideas","body":"Holography, quantum extremal surfaces and related work give important clues about information recovery in certain models, but interpretations and their applicability to realistic black holes are active research topics."},{"heading":"What we do not know","body":"No direct astrophysical experiment has yet established the microscopic mechanism behind black-hole information recovery. A good explanation distinguishes mathematically supported results from conjecture."}],"terms":[["Unitarity","Quantum time evolution preserving total probability and information in the quantum state."],["Holography","Family of ideas relating gravitational systems to lower-dimensional nongravitational descriptions."]],"example":null,"misconceptions":["There is not one universally accepted, experimentally tested resolution."],"takeaway":"This is a frontier problem, not a settled classroom fact."},"string-theory/why-string-theory":{"intro":"String theory replaces idealised point-particle fundamental ingredients with one-dimensional strings, offering a framework that contains quantum-gravity-like excitations.","sections":[{"heading":"The motivating problem","body":"General relativity and quantum field theory work exceptionally well within their domains, but standard perturbative methods for quantising gravity run into severe difficulties at very high energies."},{"heading":"Different vibration modes","body":"A string has quantised vibrational excitations, which can appear as particles with differing masses and spins. Closed-string spectra include a massless spin-2 excitation naturally associated with the graviton."},{"heading":"Extra dimensions","body":"Consistency of familiar perturbative superstring models requires more spacetime dimensions than four. The additional dimensions are proposed to be compact or otherwise hidden; their geometry affects the low-energy physics."},{"heading":"Status of the theory","body":"String theory is a rich mathematical research programme. It has not yet been experimentally confirmed as the correct description of nature, and no one should teach its speculative predictions as established facts."}],"terms":[["String tension","Energy per unit length of a string in the model."],["Graviton","Hypothetical quantum of the gravitational field."]],"example":["Explain one possible reason extra dimensions might be difficult to observe.",["Consider compactification scales and available experiment energies."],"If the extra dimensions are extremely small, present-day experiments may not resolve them."],"misconceptions":["The strings are not literally ordinary musical strings.","A mathematically consistent theory is not automatically empirically verified."],"takeaway":"Separate elegant mathematics from experimental evidence."},"string-theory/compactification":{"intro":"Compactification is the proposal that some spatial dimensions have a very small or otherwise hidden geometry.","sections":[{"heading":"From high to low dimensions","body":"A field on a compact extra dimension can be decomposed into modes with quantised momentum around that dimension. Those modes may appear as a tower of particles from a four-dimensional perspective."},{"heading":"Geometry affects physics","body":"Different compact shapes and additional structures can lead to different low-energy properties. Calabi–Yau spaces are important mathematical examples in supersymmetric string compactifications."},{"heading":"Why this is difficult","body":"There are many possible compactifications. Identifying one that matches observed particle physics and cosmology is a major unsolved challenge."}],"terms":[["Kaluza–Klein modes","Excitations associated with momentum or structure along compact dimensions."],["Calabi–Yau manifold","A class of spaces useful in certain supersymmetric compactifications."]],"example":null,"misconceptions":["Extra dimensions have not been detected."],"takeaway":"Compactification is a model-building mechanism, not a measured property of spacetime."},"cosmology/big-bang-evidence":{"intro":"The hot Big Bang framework explains an early hot dense phase of the expanding universe; it is not a confirmed explanation of what preceded that phase.","sections":[{"heading":"Cosmic expansion","body":"Observations show that distant galaxies generally have redshifts related to distance. In a homogeneous expanding universe, wavelengths stretch with the cosmological scale factor."},{"heading":"Microwave background","body":"The cosmic microwave background is relic radiation that was released when the early universe cooled enough for neutral atoms to form, roughly 380,000 years after the hot Big Bang began."},{"heading":"Light-element abundances","body":"Predictions for early-universe nuclear reactions explain much of the observed primordial hydrogen, helium and deuterium abundances."},{"heading":"Open questions","body":"The very earliest conditions, the origin of cosmic inflation and the nature of dark matter and dark energy remain active research topics."}],"terms":[["Cosmic microwave background","Relic electromagnetic radiation from the early universe."],["Redshift","Increase in observed wavelength relative to emitted wavelength."]],"example":["Name three independent lines of evidence for the hot Big Bang.",["Think about expansion, background radiation and light nuclei."],"Galaxy redshifts, the cosmic microwave background and primordial light-element abundances."],"misconceptions":["The Big Bang was not an explosion from one point into empty pre-existing space."],"takeaway":"The theory has powerful evidence but does not answer every origin question."},"cosmology/dark-energy":{"intro":"Dark energy names the unknown cause associated with the observed accelerated expansion of the universe in standard cosmological fits.","sections":[{"heading":"Observational clue","body":"Measurements of distant Type Ia supernovae, cosmic microwave background structure and galaxy clustering support an accelerating expansion in the standard model."},{"heading":"Cosmological constant","body":"The simplest current description is a constant vacuum-like energy density Λ, with negative pressure in general relativity. It is a parameterisation, not a microscopic explanation."},{"heading":"Research frontiers","body":"Researchers test whether dark energy changes over time or whether alternative gravitational models explain the observations. Claims of definitive discovery require careful model comparisons."}],"terms":[["ΛCDM","Standard cosmological model containing a cosmological constant and cold dark matter."],["Accelerated expansion","Increase in the rate of change of cosmic scale factor."]],"example":null,"misconceptions":["Dark energy is a label for a phenomenon, not a known substance collected in laboratories."],"takeaway":"Evidence for acceleration is strong; its physical explanation is unresolved."},"quantum-mechanics/entanglement":{"intro":"Entanglement is a property of composite quantum states that cannot be factored into independent states of the components.","sections":[{"heading":"More than correlation","body":"Certain entangled states produce measurement statistics that are incompatible with local hidden-variable models, as tested in Bell experiments."},{"heading":"Bell inequalities","body":"A Bell inequality sets limits on correlations achievable under specific local-realist assumptions. Experimental violations are evidence against that whole class of models."},{"heading":"No faster-than-light message","body":"Entanglement cannot by itself transmit controllable information faster than light. Individual measurement outcomes remain locally random."},{"heading":"Practical uses","body":"Entanglement is a resource for quantum information tasks such as state teleportation protocols, which still require classical communication."}],"terms":[["Entanglement","Nonseparability of a joint quantum state."],["Bell test","Experiment assessing inequalities that constrain certain local hidden-variable theories."]],"example":["Why can entanglement not send an instant message?",["Distinguish correlations from controllable outcomes."],"Each party sees random local outcomes and needs ordinary communication to compare results."],"misconceptions":["Quantum teleportation does not transport people or matter instantaneously."],"takeaway":"Nonclassical correlations do not imply instant communication."},"quantum-mechanics/quantum-tunnelling":{"intro":"Quantum tunnelling allows nonzero transmission through a potential barrier even when a classical particle lacks the energy to cross it.","sections":[{"heading":"Wavefunction in a barrier","body":"In a region where potential energy exceeds the particle energy, a stationary-state wavefunction typically decays exponentially rather than vanishing abruptly."},{"heading":"Barrier dependence","body":"Transmission probability depends strongly on barrier width and height. Increasing either tends to reduce transmission for a simple rectangular barrier."},{"heading":"Applications","body":"Tunnelling helps explain alpha decay, scanning tunnelling microscopes and some processes in semiconductor devices."}],"terms":[["Tunnelling","Quantum transmission through a classically forbidden energy barrier."]],"example":["What happens to tunnelling probability when a barrier becomes wider, other parameters fixed?",["Consider exponential attenuation."],"It generally decreases rapidly."],"misconceptions":["Tunnelling does not mean the particle borrows energy in violation of conservation."],"takeaway":"The behaviour follows from the quantum wave equation."},"astronomy/exoplanets":{"intro":"Exoplanets are planets orbiting stars other than the Sun; their discoveries reveal extraordinary diversity in planetary systems.","sections":[{"heading":"Transit detections","body":"A planet passing in front of its host star can cause a small periodic dip in measured brightness. The fractional dip approximately equals the squared ratio of planet to star radius for idealised geometry."},{"heading":"Radial velocities","body":"A planet and star both orbit their common centre of mass. The star’s motion causes periodic Doppler shifts in its spectral lines."},{"heading":"What can we infer?","body":"Transits can constrain radius; radial velocities can constrain minimum mass. Together they can estimate bulk density, subject to the orbit and observational geometry."},{"heading":"Habitable does not mean inhabited","body":"A habitable-zone orbit is one condition sometimes compatible with surface liquid water. Atmosphere, stellar activity and many other factors matter."}],"terms":[["Transit method","Detecting a planet from periodic dimming of its host star."],["Radial velocity","Detecting stellar wobble via spectral Doppler shifts."]],"example":["If a planet’s radius is 0.1 times its star’s radius, estimate transit depth.",["Square the radius ratio."],"About 1%."],"misconceptions":["A transit signal alone does not prove the planet hosts life."],"takeaway":"Discovery methods produce inferences with uncertainties."},"physics/newtons-laws":{"intro":"Newton’s laws provide an excellent model of everyday motion in inertial reference frames.","sections":[{"heading":"First law","body":"An object maintains constant velocity when the net external force is zero. A moving object does not need a continual forward net force."},{"heading":"Second law","body":"For constant mass in classical mechanics, F_net = ma. The acceleration points in the direction of the vector sum of forces."},{"heading":"Third law","body":"If A exerts a force on B, B exerts an equal and opposite force on A. The two forces act on different objects and therefore do not cancel on one object."},{"heading":"Limits","body":"At speeds close to the speed of light, very strong gravity or atomic scales, relativity or quantum models become important."}],"terms":[["Net force","Vector sum of external forces on the chosen system."],["Inertia","Resistance to changes in velocity."]],"example":["A 3 kg trolley experiences a net horizontal force of 12 N. Find its acceleration.",["Rearrange F = ma."],"4 m/s²."],"misconceptions":["Action–reaction forces do not act on the same object."],"takeaway":"Always draw a free-body diagram for the chosen object."},"computer-science/binary-numbers":{"intro":"Binary represents quantities with two digits, 0 and 1, using powers of two.","sections":[{"heading":"Place value","body":"The rightmost bit represents 2⁰, the next 2¹, then 2² and so on. For example 1011₂ = 8 + 0 + 2 + 1 = 11₁₀."},{"heading":"Why computers use it","body":"Digital circuits use voltage ranges to represent discrete states. Binary notation is a convenient mathematical description of those states."},{"heading":"Beyond positive integers","body":"Signed integers, floating-point numbers, text and images require agreed representations. Not every binary pattern means the same thing without a format."},{"heading":"Practical conversion","body":"To convert positive decimal integers to binary, repeatedly divide by two and read remainders in reverse order."}],"terms":[["Bit","A binary digit, 0 or 1."],["Byte","Commonly a sequence of eight bits."]],"example":["Convert 11010₂ to decimal.",["Add 16 + 8 + 0 + 2 + 0."],"26."],"misconceptions":["Binary is a representation, not inherently a compression method."],"takeaway":"Representation rules tell us how to interpret bits."},"computer-science/algorithms":{"intro":"An algorithm is a finite, precisely specified procedure for solving a problem.","sections":[{"heading":"Correctness before speed","body":"An algorithm should solve its intended problem for all inputs in its stated domain. Loop invariants, preconditions and tests help establish that."},{"heading":"Complexity","body":"Big-O describes an asymptotic upper bound on growth. Binary search on sorted data takes O(log n) comparisons; a straightforward linear search can take O(n)."},{"heading":"Design patterns","body":"Common strategies include divide and conquer, dynamic programming, greedy choice and graph traversal. The right strategy depends on problem structure."},{"heading":"Testing","body":"Use ordinary cases, boundaries, empty inputs, repeated values and adversarial cases. Performance claims must be measured or mathematically justified."}],"terms":[["Algorithm","Finite, unambiguous sequence of executable steps."],["Big-O","Notation expressing asymptotic upper bounds."]],"example":["Why is binary search unsuitable for an unsorted array?",["Think about which half can safely be discarded."],"The ordering guarantee needed to eliminate half the candidates is absent."],"misconceptions":["O(n) is not a fixed runtime in seconds."],"takeaway":"Correctness, complexity and implementation quality are distinct."},"computer-science/cryptography":{"intro":"Cryptography uses mathematical techniques to protect information and verify authenticity.","sections":[{"heading":"Symmetric encryption","body":"A shared secret key is used for encryption and decryption. Secure modern designs use carefully analysed algorithms and modes."},{"heading":"Public-key cryptography","body":"Public keys enable encryption or signature verification without sharing a secret private key. Key management and protocol design are crucial."},{"heading":"Hashes and signatures","body":"Cryptographic hashes summarise inputs with strong resistance properties; digital signatures bind a message to a private signing key in a verifiable way."},{"heading":"Security is a system property","body":"Using strong primitives is not enough when passwords, randomness, certificates or implementation are flawed."}],"terms":[["Encryption","Transforming readable data into ciphertext under a key."],["Digital signature","Cryptographic authentication of a message or document."]],"example":null,"misconceptions":["Encryption and hashing have different purposes."],"takeaway":"Protect keys and validate security assumptions, not just algorithm names."},"programming-software-development/python-basics":{"intro":"Python is a readable, high-level language widely used in automation, science and back-end services.","sections":[{"heading":"Variables and values","body":"Python binds names to objects. For example: `count = 3` and `name = \"Atlas\"`. Types are associated with objects, not fixed at variable declarations."},{"heading":"Control flow","body":"`if`, `for`, and `while` choose and repeat execution. Indentation is syntactically significant. Iterating over `range(3)` yields 0, 1 and 2."},{"heading":"Functions","body":"`def square(x): return x * x` defines a function. Parameters can receive different values; return passes a result to the caller."},{"heading":"Collections","body":"Lists preserve order, dictionaries map keys to values, and sets represent distinct hashable values. Choose the collection that fits the problem."}],"terms":[["List","Ordered mutable collection."],["Dictionary","Key-value mapping."]],"example":["What is the output of `sum(range(4))`?",["range(4) contains 0,1,2,3."],"6."],"misconceptions":["Python code does not run in the JavaScript playground."],"takeaway":"Readable syntax does not remove the need for tests."},"programming-software-development/javascript-basics":{"intro":"JavaScript adds dynamic behaviour to web pages and runs on servers and other runtimes.","sections":[{"heading":"Values and bindings","body":"`const` prevents reassignment of the binding, while `let` permits it. Objects held by const bindings can still be mutable."},{"heading":"Functions and arrays","body":"Functions encapsulate reusable logic. `map`, `filter` and `reduce` are useful array methods that work with functions."},{"heading":"Asynchrony","body":"Promises represent a future result. `async`/`await` offers a readable syntax for asynchronous operations, without making CPU-intensive code magically parallel."},{"heading":"Safe web programming","body":"Avoid inserting untrusted strings as HTML; use text nodes or safe rendering. Keep sensitive secrets on the server, not in browser code."}],"terms":[["Promise","Object representing the eventual state of an asynchronous operation."],["Closure","Function retaining access to variables from its lexical environment."]],"example":["What does `[1,2,3].map(x => x * 2)` return?",["map applies a function to each item."],"[2, 4, 6]."],"misconceptions":["JavaScript and Java are different programming languages."],"takeaway":"The Coding Studio lets you run JavaScript locally in a sandbox."},"world-history/primary-sources":{"intro":"Historians evaluate traces of the past in context rather than treating any single source as the whole truth.","sections":[{"heading":"Primary versus secondary","body":"A primary source is produced in, or closely connected to, the period studied: letters, photographs, records, objects and testimony. A secondary source analyses the past later, using evidence."},{"heading":"Provenance matters","body":"Ask who created a source, when, for which audience and for what purpose. The same document may be useful for one question and limited for another."},{"heading":"Corroboration","body":"Compare independent sources and relevant material evidence. Contradictions can reveal differing experiences, interests and perspectives."},{"heading":"Avoid presentism","body":"Interpret historical actors within their own circumstances while still allowing ethical assessment. Distinguish what is known from what is debated."}],"terms":[["Provenance","Origin and context of a historical source."],["Corroboration","Testing a claim against additional independent evidence."]],"example":["An official wartime poster claims a battle was an overwhelming success. How should a historian use it?",["Consider intended audience, purpose and independent accounts."],"As evidence of wartime messaging; verify battlefield outcomes against independent records."],"misconceptions":["A primary source is not automatically unbiased or accurate."],"takeaway":"Good historical claims rely on context and comparison."},"world-history/first-world-war":{"intro":"The First World War, fought from 1914 to 1918, was a global conflict with complex causes and consequences.","sections":[{"heading":"Longer-term tensions","body":"Militarism, competing alliances, imperial rivalry and nationalism increased the risk of a wider war. Historians disagree about how to weigh these causes."},{"heading":"Crisis of 1914","body":"The assassination of Archduke Franz Ferdinand in Sarajevo on 28 June 1914 triggered a diplomatic and military crisis that escalated into war."},{"heading":"War and societies","body":"Trench warfare was prominent on the Western Front, while other theatres had very different conditions. States mobilised huge resources; civilians experienced losses, displacement and hardship."},{"heading":"Aftermath","body":"The war ended with armistices in 1918. Peace agreements, including the 1919 Treaty of Versailles, reshaped borders and politics, but did not resolve every conflict."}],"terms":[["Armistice","Agreement to stop fighting; not necessarily a final peace treaty."],["Total war","Broad mobilisation of societies and economies for warfare."]],"example":["Why is it misleading to name only one cause of the First World War?",["Distinguish trigger, structural causes and decisions."],"The assassination sparked a crisis, but alliance commitments, rivalry, nationalism and political decisions shaped escalation."],"misconceptions":["The assassination alone does not explain all causes."],"takeaway":"Good history separates chronology, causation and interpretation."},"world-history/second-world-war":{"intro":"The Second World War (1939–1945 in the conventional European chronology) transformed global politics and caused vast human suffering.","sections":[{"heading":"Causes and expansion","body":"The Nazi invasion of Poland in September 1939 prompted Britain and France to declare war on Germany. The conflict became global, with major fighting also in Asia and the Pacific."},{"heading":"Civilian consequences","body":"Bombing, forced labour, occupation, famine and genocide affected millions. The Holocaust was the systematic genocide of European Jews by Nazi Germany and its collaborators."},{"heading":"Turning points","body":"Events such as the Battle of Britain, the German invasion of the Soviet Union, Midway and Stalingrad changed strategic conditions; different regions followed different timelines."},{"heading":"Consequences","body":"The war ended in Europe in May 1945 and in Asia in September 1945 after Japan’s surrender. It shaped the UN, decolonisation and Cold War international relations."}],"terms":[["Genocide","Acts committed with intent to destroy a protected group, in whole or in part."],["Holocaust","Nazi genocide of approximately six million European Jews."]],"example":["Why does studying multiple theatres matter?",["Compare European, Asian and Pacific experiences."],"It avoids treating the war as a single regional story and reveals interconnected causes and consequences."],"misconceptions":["Do not reduce victims to statistics or confuse the Holocaust with generic wartime suffering."],"takeaway":"Historical accuracy includes respectful attention to people affected."},"geography/plate-tectonics":{"intro":"Plate tectonics explains how large pieces of Earth’s outer rigid shell move and interact over geological time.","sections":[{"heading":"The lithosphere","body":"Earth’s lithosphere is broken into tectonic plates. Motion is measured in centimetres per year and is linked to mantle dynamics and gravitational forces such as slab pull."},{"heading":"Three boundary types","body":"Divergent boundaries separate, convergent boundaries meet, and transform boundaries slide past one another. Different boundaries produce different patterns of earthquakes, volcanism and mountain building."},{"heading":"Evidence","body":"Seafloor magnetic stripes, earthquake distribution, GPS measurements and the fit of geological features support the theory."},{"heading":"Hazard planning","body":"Plate boundaries are associated with many hazards, but not every earthquake or volcano occurs at a simple plate boundary. Hazard maps support preparedness, not certainty."}],"terms":[["Lithosphere","Rigid outer shell comprising crust and uppermost mantle."],["Subduction","Movement of one tectonic plate beneath another."]],"example":["Explain why earthquakes cluster near many plate boundaries.",["Think about friction, stress and sudden release."],"Relative plate motion builds stress that can be released suddenly along faults."],"misconceptions":["Continents are part of plates; they do not simply float on liquid magma."],"takeaway":"Maps of plates help explain geography and risk."},"geography/map-projections":{"intro":"Every flat map projection distorts some aspect of the spherical Earth.","sections":[{"heading":"Why distortion is unavoidable","body":"A curved globe cannot be flattened into a plane without altering at least some shape, area, distance or direction."},{"heading":"Mercator projection","body":"Mercator preserves local angles and shapes but greatly exaggerates areas at high latitudes. It is useful for certain navigation tasks but poor for comparing country area."},{"heading":"Choosing a map","body":"Equal-area maps help compare the size of regions. Other projections prioritise distances, directions or visual balance. The right choice follows the question."},{"heading":"Critical map reading","body":"Read the legend, scale, projection, date and data source. A map is an argument about which geographic relationships matter."}],"terms":[["Projection","Rule for representing Earth’s curved surface on a flat map."],["Equal-area projection","Map projection designed to preserve area."]],"example":["Why is Greenland misleadingly large on a Mercator world map?",["Look at the effect of high latitude on scale."],"Scale expands toward the poles, exaggerating high-latitude areas."],"misconceptions":["No flat world map is distortion-free."],"takeaway":"Map selection should follow purpose, not habit."},"geography/climate-change-impacts":{"intro":"Climate change affects places unevenly because hazards, exposure and adaptive capacity differ geographically.","sections":[{"heading":"Physical changes","body":"A warming climate shifts temperature distributions, influences precipitation extremes, melts land ice and contributes to sea-level rise."},{"heading":"Human geography","body":"Risk depends on where people live, housing quality, infrastructure, livelihoods and access to resources. Identical physical hazards can have very different impacts."},{"heading":"Mitigation versus adaptation","body":"Mitigation reduces the causes of climate change, particularly greenhouse gas emissions. Adaptation manages impacts through choices such as flood protection, heat plans and resilient crops."},{"heading":"Interpreting evidence","body":"Compare long-term trends with weather variability. Use measurements, credible projections and stated uncertainty when evaluating regional case studies."}],"terms":[["Mitigation","Reducing human-caused climate forcing."],["Adaptation","Adjusting systems to moderate or benefit from climate impacts."]],"example":["Give an example of climate mitigation and an example of adaptation.",["One reduces the cause; the other reduces harm."],"Replacing fossil-fuel electricity with low-carbon generation is mitigation; raising flood barriers is adaptation."],"misconceptions":["A cold day does not disprove a long-term global warming trend."],"takeaway":"Physical and social factors together shape geographic vulnerability."},"biology/dna-structure":{"intro":"DNA is the molecule that stores inherited genetic information in nearly all cellular organisms.","sections":[{"heading":"Double helix","body":"DNA generally forms two antiparallel nucleotide strands wound into a helix. Each nucleotide contains a sugar, phosphate and one of four bases: A, T, C or G."},{"heading":"Base pairing","body":"A pairs with T, and C pairs with G in standard double-stranded DNA. Base pairing helps each strand act as a template during replication."},{"heading":"Genes and expression","body":"A gene is a region of DNA with a functional product, such as an RNA or protein. Gene expression is regulated and depends on cellular context."},{"heading":"Mutation and variation","body":"Changes in DNA sequence can be neutral, harmful or beneficial depending on context. Not all mutations change protein sequence or cause disease."}],"terms":[["Nucleotide","DNA building block containing sugar, phosphate and a nitrogenous base."],["Gene","DNA region that contributes to a functional RNA or protein product."]],"example":["Write the complementary sequence to 5′-ATCG-3′.",["Remember antiparallel strands and A–T/C–G."],"3′-TAGC-5′."],"misconceptions":["DNA does not directly determine every trait without environment and regulation."],"takeaway":"Molecular structure helps explain inheritance."},"mathematics/quadratic-equations":{"intro":"A quadratic equation has the form ax² + bx + c = 0 with a ≠ 0.","sections":[{"heading":"Factoring","body":"If a quadratic factors as (x−r)(x−s)=0, then x=r or x=s by the zero-product rule."},{"heading":"Completing the square","body":"Rewriting ax²+bx+c in vertex form reveals the parabola’s turning point and leads to the quadratic formula."},{"heading":"Quadratic formula","body":"For ax²+bx+c=0, the solutions are x = (−b ± √(b²−4ac))/(2a). The discriminant Δ=b²−4ac determines the number of distinct real roots."},{"heading":"Graphical meaning","body":"Real roots correspond to where the parabola y=ax²+bx+c intersects the x-axis. No real roots means no x-axis crossing."}],"terms":[["Discriminant","Quantity b²−4ac classifying the real roots."],["Root","Value of x making an equation true."]],"example":["Solve x² − 5x + 6 = 0.",["Factor into (x−2)(x−3)."],"x=2 or x=3."],"misconceptions":["The quadratic formula denominator is 2a, not 2."],"takeaway":"Connect algebraic answers to the shape of the graph."},"artificial-intelligence/transformers":{"intro":"Transformers are neural-network architectures built around attention mechanisms and feed-forward layers.","sections":[{"heading":"Attention","body":"Self-attention lets a model combine information from different positions in a sequence, producing context-dependent representations."},{"heading":"Position information","body":"Attention alone does not encode order, so models use positional information, such as learned embeddings or rotary position methods, to represent sequence relationships."},{"heading":"Training","body":"Language models are often trained to predict tokens from context. Training objectives and datasets strongly influence behaviour; next-token training does not guarantee truth or reasoning."},{"heading":"Limits and safety","body":"Transformers can produce fluent but false text. Evaluations, retrieval, careful prompting and human verification help reduce risk without eliminating it."}],"terms":[["Token","Unit of text or other data processed by a model."],["Self-attention","Mechanism that computes context-dependent relationships among sequence positions."]],"example":["Why do many Transformer models need positional information?",["Think about order in a sentence."],"Without positional information, basic attention does not intrinsically know sequence order."],"misconceptions":["Language-model fluency is not evidence that a claim is correct."],"takeaway":"Attention is a computational mechanism, not proof of understanding."},"game-development/game-physics":{"intro":"Game physics approximates motion and collisions fast enough for interactive applications.","sections":[{"heading":"Fixed update steps","body":"Many game engines update physics at a fixed interval to improve reproducibility and stability across rendering frame rates."},{"heading":"Integrating motion","body":"A simple integrator updates velocity from acceleration and position from velocity. Euler integration is inexpensive but has numerical error."},{"heading":"Collisions","body":"Collision detection finds overlapping shapes or impending contacts. Response applies impulses or constraints rather than merely reversing every velocity."},{"heading":"Performance and feel","body":"A game may prioritise responsiveness over strict physical realism. A consistent model, measurable tuning and clear feedback are essential."}],"terms":[["Time step","Interval over which simulation state advances."],["Collision impulse","Rapid change in momentum used to resolve contact."]],"example":["An object at 2 m/s travels for 0.5 s at constant velocity. Find displacement.",["Multiply speed by time."],"1 metre."],"misconceptions":["Rendering frame rate and physics update rate are not the same."],"takeaway":"Stable simulations require careful time stepping."},"space-exploration/rocket-equation":{"intro":"The ideal rocket equation connects change in velocity to exhaust velocity and propellant mass ratio.","sections":[{"heading":"The equation","body":"For an ideal rocket with constant effective exhaust velocity and no external forces, Δv = vₑ ln(m₀/mf). Here m₀ is initial mass and mf final mass."},{"heading":"Why stages help","body":"The logarithmic mass-ratio dependence makes very large Δv costly in propellant. Staging can discard empty structure and improve vehicle performance."},{"heading":"Real mission limits","body":"Gravity losses, aerodynamic drag, engine performance and trajectory constraints mean the ideal rocket equation is not the entire launch calculation."}],"terms":[["Delta-v","Change in velocity capability used to plan space manoeuvres."],["Mass ratio","Initial mass divided by final mass."]],"example":["If m₀/mf=e and vₑ=3 km/s, calculate ideal Δv.",["ln(e)=1."],"3 km/s."],"misconceptions":["The ideal formula neglects gravity and drag losses."],"takeaway":"Mission design is a balance of physics, mass and constraints."}},"facts":{"black-hole-physics":[{"topic":"schwarzschild-radius","prompt":"In the Schwarzschild solution, the event-horizon radius is proportional to which property?","choices":["Mass","Surface brightness","Temperature squared","Distance from Earth"],"answer":0,"explanation":"rₛ=2GM/c², so radius scales linearly with mass."},{"topic":"event-horizon","prompt":"Which description best fits an event horizon?","choices":["A causal boundary beyond which outgoing signals cannot reach distant observers","A solid wall","A ring of hot gas","The centre of the singularity"],"answer":0,"explanation":"A horizon is a boundary in spacetime, not material."},{"topic":"photon-sphere","prompt":"For a nonrotating black hole, where is the unstable circular photon orbit?","choices":["Outside the event horizon","Deep inside the singularity","At the centre of the black hole","At the same radius as every accretion disk"],"answer":0,"explanation":"For Schwarzschild geometry the photon sphere lies at 1.5 rₛ."},{"topic":"hawking-radiation","prompt":"For nonrotating black holes, how does Hawking temperature change with increasing mass?","choices":["It decreases","It rises linearly","It stays constant","It depends only on distance from Earth"],"answer":0,"explanation":"T_H is inversely proportional to M."},{"topic":"black-hole-shadows","prompt":"What does the Event Horizon Telescope image mainly show?","choices":["Emission around a central shadow","The singularity itself","The event horizon as a solid surface","The inside of the black hole"],"answer":0,"explanation":"The bright ring comes from surrounding plasma and light bending."},{"topic":"gravitational-wave-mergers","prompt":"What detectors made direct gravitational-wave observations from black hole mergers?","choices":["LIGO interferometers","Optical microscopes","Radar weather stations","Geiger counters"],"answer":0,"explanation":"Laser interferometers measure exceptionally small differences in arm length."},{"topic":"black-hole-thermodynamics","prompt":"Black hole entropy in the Bekenstein–Hawking formula scales with which horizon property?","choices":["Area","Volume","Surface brightness","Magnetic field alone"],"answer":0,"explanation":"Black-hole entropy is proportional to horizon area in semiclassical gravity."},{"topic":"kerr-black-holes","prompt":"The Kerr solution models a black hole with which additional property?","choices":["Rotation","A perfectly rigid surface","Negative mass","No gravitational field"],"answer":0,"explanation":"Kerr describes an uncharged rotating black hole."},{"topic":"spaghettification","prompt":"What chiefly causes spaghettification near a compact object?","choices":["Differences in gravitational acceleration across an object","Heat from visible light","Absolute absence of gravity","Motion through empty space"],"answer":0,"explanation":"Strong tidal gravity stretches an extended body."},{"topic":"information-paradox","prompt":"The information paradox mainly concerns a possible tension between black-hole evaporation and what quantum principle?","choices":["Unitarity","The periodic table","Newton’s third law","Kepler’s second law"],"answer":0,"explanation":"Unitary quantum dynamics preserve information in a precise state-evolution sense."}],"string-theory":[{"topic":"why-string-theory","prompt":"What is a key proposed benefit of string theory?","choices":["A framework with quantum-gravity-like excitations","A confirmed cure for every disease","A telescope that detects extra dimensions","A proof the universe has ten observable spatial dimensions"],"answer":0,"explanation":"Closed-string spectra naturally include a massless spin-2 excitation."},{"topic":"open-strings","prompt":"Open strings are modelled as having what?","choices":["Two endpoints","No endpoints","Exactly three endpoints","A single point only"],"answer":0,"explanation":"Open strings have two endpoints; closed strings form loops."},{"topic":"closed-strings","prompt":"Which fundamental excitation commonly appears among closed-string modes?","choices":["A graviton-like spin-2 state","A guaranteed electron with fixed mass","A classical planet orbit","A visible sound wave"],"answer":0,"explanation":"Closed strings yield a massless spin-2 mode in consistent models."},{"topic":"compactification","prompt":"Why are extra dimensions sometimes considered hidden?","choices":["They may be compactified on very small scales","They are visible only during eclipses","They are inside ordinary atoms only","They are measured in degrees Celsius"],"answer":0,"explanation":"Small compactification scales can be beyond present experimental resolution."},{"topic":"lack-of-direct-confirmation","prompt":"What is the empirical status of string theory as a fundamental theory of nature?","choices":["Not directly confirmed","Experimentally proven in particle colliders","Disproved by every gravity experiment","An official replacement for all standard physics"],"answer":0,"explanation":"String theory is mathematically active but not experimentally established."},{"topic":"d-branes","prompt":"What can D-branes provide in string models?","choices":["Surfaces on which certain open-string endpoints can lie","An alternative name for protons","A way to avoid all mathematics","A measured new chemical element"],"answer":0,"explanation":"D-branes are dynamical extended objects in string theory."}],"cosmology":[{"topic":"hubble-expansion","prompt":"What does cosmological redshift broadly indicate for distant galaxies in the expanding universe?","choices":["Expansion of the cosmic scale factor","That galaxies must be cooling locally","That light has no finite speed","That Earth lies at the centre of space"],"answer":0,"explanation":"Cosmic expansion stretches the wavelength of propagating light."},{"topic":"cosmic-microwave-background","prompt":"What is the cosmic microwave background?","choices":["Relic radiation from the early universe","Light reflected from the Moon","Radiation emitted only by modern satellites","A layer of dust around Earth"],"answer":0,"explanation":"The CMB was released when the universe became transparent to photons."},{"topic":"dark-energy","prompt":"Which observation helped establish cosmic acceleration?","choices":["Distant Type Ia supernova brightness versus redshift","Earthquake recordings","Daily tides","Lunar craters"],"answer":0,"explanation":"Supernova distance measurements were among key evidence for acceleration."},{"topic":"big-bang-evidence","prompt":"Which evidence supports the hot Big Bang model?","choices":["Primordial light-element abundances","The constancy of the seasons","The shape of mountain ranges","The location of country borders"],"answer":0,"explanation":"Predicted early nucleosynthesis matches observed primordial abundances broadly."},{"topic":"heat-death","prompt":"A heat-death scenario describes what broad future?","choices":["Increasing approach toward thermodynamic equilibrium","A guaranteed universe-wide explosion next year","All stars becoming younger","An expanding universe turning into a single planet"],"answer":0,"explanation":"In standard accelerating-expansion scenarios usable energy gradients decline over very long times."}],"quantum-mechanics":[{"topic":"entanglement","prompt":"Can entanglement alone send a controllable faster-than-light message?","choices":["No","Yes, always","Only between planets","Only with lasers"],"answer":0,"explanation":"Correlations do not grant control over individual local outcomes."},{"topic":"born-rule","prompt":"What does the Born rule connect to the squared magnitude of an amplitude?","choices":["Measurement probability","Classical force","Electric resistance","Planetary orbit period"],"answer":0,"explanation":"The squared amplitude gives probability density or outcome probability."},{"topic":"uncertainty-principle","prompt":"The position-momentum uncertainty relation refers to what?","choices":["An intrinsic bound on spreads of incompatible observables","Poorly calibrated clocks only","A limit that disappears with faster computers","A rule that forbids all measurements"],"answer":0,"explanation":"Noncommuting observables cannot both have arbitrarily sharp values in a quantum state."},{"topic":"double-slit-experiment","prompt":"What appears when coherent quantum alternatives interfere?","choices":["An interference pattern","Only one unchanging dark stripe","Instant superluminal signals","Only classical collisions"],"answer":0,"explanation":"Superposition of amplitudes produces an interference distribution."},{"topic":"quantum-tunnelling","prompt":"What happens to tunnelling through a simple barrier as its width increases?","choices":["Probability generally decreases","Probability must become exactly one","Particle mass vanishes","The barrier becomes a black hole"],"answer":0,"explanation":"Evanescent wavefunctions decrease with penetration distance."},{"topic":"no-cloning-theorem","prompt":"What does the no-cloning theorem forbid?","choices":["Perfect copying of an arbitrary unknown quantum state","All classical copying","Measuring any quantum system","Using multiple qubits"],"answer":0,"explanation":"Linearity prevents a universal perfect quantum copier."}],"astronomy":[{"topic":"exoplanets","prompt":"Which method detects a planet from periodic dips in a star’s brightness?","choices":["Transit method","Seismic imaging","Thermal weather maps","Carbon dating"],"answer":0,"explanation":"A planet crossing the stellar disk can block a small fraction of light."},{"topic":"telescopes","prompt":"What is a primary advantage of a larger telescope aperture?","choices":["Greater light-gathering capability","Instant travel to the target","Removal of all atmospheric effects","A guarantee of visible planets"],"answer":0,"explanation":"Collected light scales with the collecting area."},{"topic":"stellar-evolution","prompt":"What primarily determines a star’s broad evolutionary path?","choices":["Its initial mass","Its constellation name","The colour of Earth’s oceans","The calendar month of discovery"],"answer":0,"explanation":"Mass governs central pressures, fuel use and evolutionary timescales."},{"topic":"light-years-and-parsecs","prompt":"A light-year is a unit of what?","choices":["Distance","Time only","Mass","Energy per second"],"answer":0,"explanation":"It is the distance light travels in one year in vacuum."}],"astrophysics":[{"topic":"chandrasekhar-limit","prompt":"The Chandrasekhar limit is associated with which object?","choices":["A white dwarf supported by electron degeneracy pressure","An ordinary terrestrial volcano","A comet orbit","A black hole with no mass"],"answer":0,"explanation":"It marks an approximate maximum mass for a cold nonrotating white dwarf with specified composition."}],"physics":[{"topic":"newtons-laws","prompt":"What is the net force on an object moving at constant velocity in an inertial frame?","choices":["Zero","Always equal to its mass","Always positive","Equal to speed s function outlineLesson(s,t){let domain=s.category, source=domain==='Space'?'NASA Science, ESA Science and peer-reviewed introductory texts':domain==='History & Society'?'museum collections, primary sources and credible historical scholarship':domain==='Earth & Nature'?'scientific field observations, atlases and institutional data':'introductory textbooks, verified reference sources and worked examples';return `<div class="article outline-lesson"><div class="eyebrow">STRUCTURED STUDY GUIDE</div><h2 style="margin:10px 0">Building your understanding of ${e(t.title)}</h2><p>This topic is in the curated curriculum index. A fully authored explanation is not yet available. Use this transparent outline to study the topic with care, rather than relying on invented facts or unsupported answers.</p><div class="article-section"><h3>1. Establish the key concept</h3><p>Write a precise, sourced definition of ${e(t.title)}. Note its place within ${e(s.name)}, the terminology used by specialists and the assumptions that apply.</p></div><div class="article-section"><h3>2. Follow the evidence</h3><p>Find at least two examples, sources, datasets, observations or worked problems relevant to ${e(t.title)}. Distinguish direct evidence from interpretations, theoretical proposals and personal opinions. Useful starting points include ${e(source)}.</p></div><div class="article-section"><h3>3. Apply the ideas</h3><p>Explain how ${e(t.title)} relates to another topic in ${e(s.name)}. Construct a real example, a diagram, a short essay, a proof or an algorithm as appropriate to the discipline.</p></div><div class="article-section"><h3>4. Test the boundaries</h3><p>Identify a common misunderstanding or unresolved question. Explain what is known, what has been demonstrated and what still requires evidence. Summarise the learning in five accurate points.</p></div><div class="info" style="margin-top:15px">There are 20 topic-specific structured practice prompts ready for this outline. They are self-as function guidedQuestion(s,t,i){const spec=TASKS[i],special=DOMAIN_TASKS[s.category],advanced=i>=13;let text=spec[1];if(special&&[5,9,15].includes(i))text=special[[5,9,15].indexOf(i)];return {id:`guided:${s.id}:${t.id}:${i+1}`,subjectId:s.id,topicId:t.id,topicTitle:t.title,subjectName:s.name,level:promptLevel(i),kind:'guided',prompt:text.replaceAll('{topic}',t.title).replaceAll('{subject}',s.name),skill:spec[0],criteria:advanced?['State the key definitions, assumptions and what is established versus conjectural.','Present a rigorous argument: mathematical proof, critical source analysis, working program or verifiable evidence appropriate to this subject.','Consider counterexamples, limitations or competing models; identify what additional test, proof or primary source would resolve uncertainty.']:['Is the explanation factually accurate and grounded in the discipline?','Does it give precise reasoning, evidence, an appropriate example or checked source?','Does it distinguish assumptions, limitations and genuine uncertainty?']}}
function allGuided(s){return s.topics.flatMap(t=>Array.from({length:TOPIC_Q},(_,i)=>guidedQuestion(s,t,i)))}
function allReviewed(s){return (K.facts?.[s.id]||[]).map((q,i)=>{const ordered=shuffled(q.choices.map((text,j)=>({text,isCorrect:j===q.answer})),`mcq:${s.id}:${i}`);return {id:`reviewed:${s.id}:${i}`,subjectId:s.id,topicId:q.topic,topicTitle:s.topics.find(t=>t.id===q.topic)?.title||'General',subjectName:s.name,level:'Medium',kind:'mcq',prompt:q.prompt,options:ordered.map(x=>x.text),correct:ordered.findIndex(x=>x.isCorrect),explanation:q.explanation,skill:'Knowledge check'}})}
function questionsFor(s,level='All'){let out=[...allGuided(s),...allReviewed(s)];return level==='All'?out:out.filter(q=>q.level===level)}
function getQuestion(id){const p=String(id).split(':'),s=byId[p[1]];if(!s)return null;if(p[0]==='reviewed')return allReviewed(s)[Number(p[2])]||null;if(p[0]==='guided'){let t=s.topics.find(t=>t.id===p[2]),n=Number(p[3]);return t&&n>=1&&n<=TOPIC_Q?guidedQuestion(s,t,n-1):null}return null}
function answerRubric(q){return q.kind==='mcq'?`<div class="info"><strong>Answer:</strong> ${e(q.options[q.correct])}<p>${e(q.explanation)}</p></div>`:`<div class="info"><strong>Self-assessment rubric:</strong><ol style="margin:7px 0 0;padding-left:20px">${q.criteria.map(c=>`<li>${e(c)}</li>`).join('')}</ol><p style="margin-top:8px">Research-style responses are not given invented, automatically graded answers.</p></div>`}
function questionHTML(q){return `<div class="wrap"><span class="pill purple">${e(q.subjectName)}</span><span class="pill">${e(q.level)}</span><span class="pill ${q.kind==='mcq'?'mint':'amber'}">${q.kind==='mcq'?'Reviewed · auto-marked':'Guided · self-assessed'}</span></div><h3 style="line-height:1.55;margin:13px 0">${e(q.prompt)}</h3><p class="muted small">${e(q.topicTitle)} · ${e(q.skill)}</p>`}

function makeTest(sid,version,count,level='All',mode='practice',topicId=null){let s=byId[sid]||S[0],pool=questionsFor(s,level);if(topicId)pool=pool.filter(q=>q.topicId===topicId);const ids=shuffled(pool,`${s.id}:${version}:${level}:${topicId||'all'}`).slice(0,clamp(Number(count)||20,1,1000)).map(q=>q.id);return {id:`${s.id}:${Date.now()}`,subjectId:s.id,version:clamp(Number(version)||1,1,60),level,mode,topicId,ids,idx:0,answers:{},started:Date.now()}}
function testSummary(v){let attempted=0,passed=0,reviewed=0,self=0,needsReview=0;for(let id of v.ids){let q=getQuestion(id),a=v.answers[id];if(!a)continue;if(q?.kind==='mcq'&&a.choice!==undefined){attempted++;reviewed++;if(+a.choice===q.correct)passed++;else needsReview++}else if(q?.kind==='guided'&&a.self){attempted++;self++;if(a.self==='yes')passed++;else needsReview++}}return {attempted,passed,reviewed,self,needsReview,total:v.ids.length,percent:pct(passed,Math.max(1,attempted))}}

tnAction('✓ I met the rubric','self-grade','data-grade="yes"',a.self==='yes'?'mint':'')}${btnAction('Needs more work','self-grade','data-grade="no"',a.self==='no'?'amber':'')}</div>`:''}`:`<div style="margin-top:16px">${btnAction(q.kind==='mcq'?'Check answer':'Reveal assessment rubric','reveal-answer','','primary')}</div>`}</div><div class="wrap" style="justify-content:space-between;margin-top:18px">${btnAction('← Previous','test-prev',ses.idx===0?'disabled':'')}${btnAction(ses.idx===ses.ids.length-1?'Finish test →':'Next question →',ses.idx===ses.ids.length-1?'finish-test':'test-next','','primary')}</div></div><div class="tile"><h3>Session progress</h3><div class="grid2" style="margin:12px 0"><div class="stat-box"><div class="k">${res.attempted}</div><div class="v">assessed</div></div><div class="stat-box"><div class="k">${res.passed}</div><div class="v">met criteria</div></div></div><p class="muted small">Jump between the first 100 questions. Purple is current; green is assessed.</p><div class="question-dots" style="margin:13px 0">${ses.ids.slice(0,100).map((id,i)=>`<button class="question-dot ${i===ses.idx?'current':''} ${ses.answers[id]?.self||ses.answers[id]?.choice!==undefined?'done':''}" data-action="jump-question" data-index="${i}" title="Question ${i+1}">${i+1}</button>`).join('')}</div>${ses.ids.length>100?'<p class="muted small">First 100 shown here; Next continues through the full set.</p>':''}<div class="divider"></div>${btnAction('Save & return later','pause-test','','block')}${btnAction('See results now','finish-test','','block ghost')}</div></div>`}

case 'select-element':ui.selectedElement=Number(btn.dataset.z);render();break;
case 'export-progress':exportProgress();break;
case 'reset-progress':if(confirm('Permanently delete all local progress, notes, bookmarks and test history on this device?')){state=NEW_STATE();activity();ui.flashDeck=[];render();toast('Local progress reset.')}break;
}}
document.addEventListener('click',ev=>{let btn=ev.target.closest?.('[data-action]');if(!btn||btn.disabled)return;ev.preventDefault();act(btn)});
document.addEventListener('input',ev=>{let input=ev.target;if(input.matches?.('input:not([type=file]),textarea')&&input.dataset.input)updateInput(input)});
document.addEventListener('change',ev=>{let input=ev.target;if(input.matches?.('select[data-input]'))updateSelect(input);if(input.id==='import-file'){let file=input.files?.[0];if(file)file.text().then(txt=>{try{let data=JSON.parse(txt);if(data.version!==1||!data.completed||!data.history||!data.notes)throw Error('Not a supported backup');if(!confirm('Import this progress backup? It will replace the current local progress.'))return;state={...NEW_STATE(),...data};save();render();toast('Backup imported.')}catch(err){alert('Could not import backup: '+err.message)}})}});
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();ui.modal='search';render();document.getElementById('modal-search')?.focus()}if(ev.key==='Escape'&&ui.modal){ui.modal=null;render()}if(ev.key==='Enter'&&ui.modal==='search'&&document.activeElement?.id==='modal-search'){ui.globalSearch=document.activeElement.value;ui.modal=null;go('search')}});
window.addEventListener('hashchange',()=>{ui.mobileOpen=false;ui.modal=null;ui.subjectTab='topics';ui.topicSearch='';render();window.scrollTo(0,0)});
setInterval(updateTimerDisplay,1000);
if(!location.hash)history.replaceState(null,'','#/home');
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

</script>
</body>
</html>
